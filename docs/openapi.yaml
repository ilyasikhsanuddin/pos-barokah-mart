openapi: 3.1.0
info:
  title: API Kasir Barokah Mart
  version: 0.5.0
  summary: REST API Point of Sales untuk aplikasi kasir minimarket Barokah Mart.
  description: |
    Kontrak resmi antara tim back end dan tim aplikasi kasir.

    **Konvensi umum**

    - Seluruh nilai uang berupa **bilangan bulat rupiah** (tanpa desimal).
    - Setiap permintaan wajib membawa header `Accept: application/json`.
    - Kesalahan domain selalu berbentuk `{ "kesalahan": "...", "pesan": "..." }`
      ditambah konteks sesuai jenis kesalahannya. Nilai `kesalahan` stabil dan
      boleh dipakai untuk percabangan kode; nilai `pesan` untuk manusia dan
      dapat berubah kapan saja.
    - Kesalahan validasi bentuk masukan memakai format bawaan Laravel
      `{ "message": "...", "errors": { ... } }`.

    **Aturan bisnis** yang disebut pada deskripsi endpoint (AB-1 s.d. AB-14)
    mengacu pada tabel aturan bisnis di dokumen Hands-On.

    Versi dokumen naik setiap kali kontrak berubah. Versi 1.0.0 dirilis
    bersama tag rilis akhir proyek.
  contact:
    name: Tim Back End Barokah Mart
    email: backend@barokah-mart.test
servers:
  - url: /api
    description: Server Laravel yang sedang melayani dokumen ini
security:
  - KunciApi: []
tags:
  - name: Layanan
    description: Pemeriksaan kesehatan layanan. Tidak memerlukan kunci API.
  - name: Katalog
    description: Katalog produk dan informasi pemasok.
  - name: Transaksi
    description: Penjualan, struk, dan pembatalan struk.
  - name: Laporan
    description: Ringkasan penjualan per tanggal.

paths:
  /ping:
    get:
      tags: [Layanan]
      operationId: ping
      summary: Cek layanan hidup
      description: Tidak memerlukan kunci API.
      security: []
      responses:
        '200':
          description: Layanan hidup.
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
              example:
                ok: true
                message: POS Barokah Mart API aktif

  /v1/pos/produk:
    get:
      tags: [Katalog]
      operationId: daftarProduk
      summary: Katalog produk
      description: |
        Daftar produk aktif, diurutkan menurut nama. Dapat disaring menurut
        kategori dan kata pencarian.
      parameters:
        - name: kategori
          in: query
          required: false
          description: Kode kategori.
          schema:
            type: string
            examples: [minuman]
        - name: cari
          in: query
          required: false
          description: Kata pencarian pada nama produk.
          schema:
            type: string
      responses:
        '200':
          description: Daftar produk.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Produk' }
              example:
                data:
                  - sku: SKU-001
                    nama: Beras Pandan Wangi 5 kg
                    kategori: kebutuhan_rumah
                    kategori_label: Kebutuhan Rumah Tangga
                    harga: 72000
                    harga_format: Rp 72.000
                    stok: 39
                    tersedia: true
        '401': { $ref: '#/components/responses/TanpaKunci' }

  /v1/pos/produk/{sku}:
    get:
      tags: [Katalog]
      operationId: detailProduk
      summary: Detail satu produk
      parameters:
        - $ref: '#/components/parameters/Sku'
      responses:
        '200':
          description: Detail produk.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Produk' }
              example:
                data:
                  sku: SKU-004
                  nama: Kopi Bubuk 200 g
                  kategori: minuman
                  kategori_label: Minuman
                  harga: 24000
                  harga_format: Rp 24.000
                  stok: 50
                  tersedia: true
        '401': { $ref: '#/components/responses/TanpaKunci' }
        '404': { $ref: '#/components/responses/ProdukTidakDitemukan' }

  /v1/pos/produk/{sku}/pemasok:
    get:
      tags: [Katalog]
      operationId: pemasokProduk
      summary: Pemasok dan margin satu produk
      description: |
        Daftar pemasok sebuah produk beserta harga beli dan margin.
        Pemasok utama selalu berada di urutan pertama.

        **AB-13** — harga beli dan margin adalah rahasia dagang: hanya
        peran `supervisor` yang boleh melihatnya. Peran `kasir` ditolak 403.
      parameters:
        - $ref: '#/components/parameters/Sku'
      responses:
        '200':
          description: Pemasok produk.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ProdukDenganPemasok' }
              example:
                data:
                  sku: SKU-004
                  nama: Kopi Bubuk 200 g
                  harga: 24000
                  pemasok:
                    - kode: PMS-02
                      nama: PT Distribusi Minuman Jaya
                      kota: Semarang
                      harga_beli: 20400
                      margin: 3600
                      margin_persen: 15.0
                      utama: true
                    - kode: PMS-01
                      nama: CV Sumber Pangan Solo
                      kota: Surakarta
                      harga_beli: 21100
                      margin: 2900
                      margin_persen: 12.1
                      utama: false
        '401': { $ref: '#/components/responses/TanpaKunci' }
        '403': { $ref: '#/components/responses/PeranTidakBerwenang' }
        '404': { $ref: '#/components/responses/ProdukTidakDitemukan' }

  /v1/pos/transaksi:
    get:
      tags: [Transaksi]
      operationId: daftarTransaksi
      summary: Daftar struk pada satu tanggal
      description: Seluruh struk pada tanggal yang diminta, diurutkan menurut nomor.
      parameters:
        - $ref: '#/components/parameters/Tanggal'
      responses:
        '200':
          description: Daftar struk.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Struk' }
              example:
                data:
                  - nomor: POS-20260914-0001
                    waktu: '2026-09-14T09:15:00+07:00'
                    kasir: Bambang Saputra
                    member: false
                    metode_bayar: qris
                    metode_label: QRIS
                    status: selesai
                    item:
                      - sku: SKU-001
                        nama: Beras Pandan Wangi 5 kg
                        harga_satuan: 72000
                        kuantitas: 1
                        diskon: 0
                        total: 72000
                    subtotal: 72000
                    diskon_grosir: 0
                    diskon_member: 0
                    total_diskon: 0
                    dpp: 64865
                    ppn: 7135
                    total: 72000
                    pembulatan: 0
                    total_bayar: 72000
                    dibayar: 72000
                    kembalian: 0
                    alasan_batal: null
                    dibatalkan_oleh: null
                    dibatalkan_pada: null
        '401': { $ref: '#/components/responses/TanpaKunci' }
    post:
      tags: [Transaksi]
      operationId: prosesTransaksi
      summary: Proses penjualan
      description: |
        Membuat struk baru dan mengurangi stok. Hanya dapat dipanggil pada
        jam buka toko.

        Stok diperiksa dua kali (AB-8): sekali tanpa kunci untuk pesan cepat,
        sekali dalam keadaan terkunci yang menentukan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermintaanTransaksi' }
            example:
              item:
                - sku: SKU-001
                  kuantitas: 1
              member: false
              metode_bayar: qris
      responses:
        '201':
          description: Struk berhasil dibuat.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Struk' }
              examples:
                struk:
                  $ref: '#/components/examples/ResponsStruk'
        '401': { $ref: '#/components/responses/TanpaKunci' }
        '404': { $ref: '#/components/responses/ProdukTidakDitemukan' }
        '422': { $ref: '#/components/responses/StokTidakCukup' }

  /v1/pos/transaksi/{nomor}:
    get:
      tags: [Transaksi]
      operationId: detailTransaksi
      summary: Detail satu struk
      parameters:
        - $ref: '#/components/parameters/Nomor'
      responses:
        '200':
          description: Detail struk.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Struk' }
        '401': { $ref: '#/components/responses/TanpaKunci' }
        '404': { $ref: '#/components/responses/TransaksiTidakDitemukan' }

  /v1/pos/transaksi/{nomor}/batal:
    post:
      tags: [Transaksi]
      operationId: batalkanTransaksi
      summary: Batalkan (void) satu struk
      description: |
        Hanya peran `supervisor`. Stok dikembalikan dan jejak pembatalan
        (`alasan_batal`, `dibatalkan_oleh`, `dibatalkan_pada`) tercatat pada struk.
      parameters:
        - $ref: '#/components/parameters/Nomor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alasan]
              properties:
                alasan:
                  type: string
                  minLength: 5
            example:
              alasan: Salah input kuantitas
      responses:
        '200':
          description: Struk dibatalkan.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Struk' }
        '401': { $ref: '#/components/responses/TanpaKunci' }
        '403': { $ref: '#/components/responses/PeranTidakBerwenang' }
        '404': { $ref: '#/components/responses/TransaksiTidakDitemukan' }
        '422': { $ref: '#/components/responses/ValidasiGagal' }

  /v1/pos/laporan/harian:
    get:
      tags: [Laporan]
      operationId: laporanHarian
      summary: Ringkasan omzet per tanggal
      description: Hanya struk berstatus `selesai` yang dihitung.
      parameters:
        - $ref: '#/components/parameters/Tanggal'
      responses:
        '200':
          description: Ringkasan harian.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LaporanHarian' }
              example:
                data:
                  tanggal: '2026-09-14'
                  jumlah_transaksi: 2
                  omzet: 250700
                  omzet_format: Rp 250.700
                  total_diskon: 1200
                  total_ppn: 24800
                  rata_rata_struk: 125350
                  per_metode_bayar:
                    qris: 100000
                    tunai: 150700
        '401': { $ref: '#/components/responses/TanpaKunci' }

  /v1/pos/laporan/terlaris:
    get:
      tags: [Laporan]
      operationId: laporanTerlaris
      summary: Peringkat produk terjual
      parameters:
        - $ref: '#/components/parameters/Tanggal'
        - name: batas
          in: query
          required: false
          description: Jumlah baris. Dipotong ke rentang 1–20; `meta.batas` melaporkan nilai yang diterapkan.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        '200':
          description: Peringkat produk.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProdukTerlaris' }
                  meta:
                    type: object
                    required: [tanggal, batas]
                    properties:
                      tanggal: { type: string, format: date }
                      batas: { type: integer }
              example:
                data:
                  - sku: SKU-006
                    nama: Air Mineral 600 ml
                    kuantitas: 12
                    pendapatan: 36000
                meta:
                  tanggal: '2026-09-14'
                  batas: 5
        '401': { $ref: '#/components/responses/TanpaKunci' }

  /v1/pos/laporan/kategori:
    get:
      tags: [Laporan]
      operationId: laporanKategori
      summary: Penjualan per kategori
      description: |
        **AB-14** — produk yang ditarik dari rak tetap dihitung pada laporan
        tanggal-tanggal sebelumnya. Kategori tanpa penjualan tetap tampil
        dengan nilai 0 (bukan null).
      parameters:
        - $ref: '#/components/parameters/Tanggal'
      responses:
        '200':
          description: Penjualan per kategori.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PenjualanKategori' }
                  meta:
                    type: object
                    required: [tanggal, total_pendapatan]
                    properties:
                      tanggal: { type: string, format: date }
                      total_pendapatan: { $ref: '#/components/schemas/Rupiah' }
              example:
                data:
                  - kode: kebutuhan_rumah
                    nama: Kebutuhan Rumah Tangga
                    kuantitas: 3
                    pendapatan: 109000
                  - kode: alat_tulis
                    nama: Alat Tulis
                    kuantitas: 0
                    pendapatan: 0
                meta:
                  tanggal: '2026-09-14'
                  total_pendapatan: 109000
        '401': { $ref: '#/components/responses/TanpaKunci' }

components:
  securitySchemes:
    KunciApi:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Kunci API pemilik peran. Untuk pengembangan lokal:
        `kasir-dev-001` (peran kasir) dan `spv-dev-001` (peran supervisor).

  parameters:
    Sku:
      name: sku
      in: path
      required: true
      description: Kode produk, berpola `SKU-` diikuti tiga digit.
      schema:
        type: string
        pattern: '^SKU-[0-9]{3}$'
        examples: [SKU-004]
    Nomor:
      name: nomor
      in: path
      required: true
      description: Nomor struk.
      schema:
        type: string
        pattern: '^POS-[0-9]{8}-[0-9]{4}$'
        examples: [POS-20260914-0001]
    Tanggal:
      name: tanggal
      in: query
      required: false
      description: Tanggal dengan format `YYYY-MM-DD`. Bila kosong, memakai tanggal hari ini.
      schema:
        type: string
        format: date

  responses:
    TanpaKunci:
      description: Header X-API-Key tidak ada atau tidak dikenal.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Kesalahan' }
          examples:
            hilang:
              summary: Header tidak dikirim
              value: { kesalahan: kunci_api_hilang, pesan: Header X-API-Key wajib disertakan. }
            tidakDikenal:
              summary: Kunci salah
              value: { kesalahan: kunci_api_tidak_dikenal, pesan: Kunci API tidak dikenal. }
    PeranTidakBerwenang:
      description: Peran pemilik kunci API tidak diizinkan melakukan aksi ini.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Kesalahan' }
          example:
            kesalahan: peran_tidak_berwenang
            pesan: 'Aksi ini hanya boleh dilakukan oleh: supervisor.'
            peran_anda: kasir
    ProdukTidakDitemukan:
      description: SKU cocok pola, tetapi tidak ada di katalog.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Kesalahan' }
          example:
            kesalahan: produk_tidak_ditemukan
            pesan: Produk dengan SKU SKU-999 tidak ditemukan.
            sku: SKU-999
    TransaksiTidakDitemukan:
      description: Nomor struk cocok pola, tetapi tidak ada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Kesalahan' }
          example:
            kesalahan: transaksi_tidak_ditemukan
            pesan: Transaksi POS-20260914-0999 tidak ditemukan.
            nomor: POS-20260914-0999
    StokTidakCukup:
      description: Stok produk tidak mencukupi (AB-8).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Kesalahan' }
          example:
            kesalahan: stok_tidak_cukup
            pesan: Stok SKU-001 tidak mencukupi. Diminta 5, tersedia 2.
            sku: SKU-001
            diminta: 5
            tersedia: 2
    ValidasiGagal:
      description: Bentuk masukan tidak sah.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/KesalahanValidasi' }
          example:
            message: The alasan field must be at least 5 characters.
            errors:
              alasan: [The alasan field must be at least 5 characters.]

  schemas:
    Rupiah:
      type: integer
      description: Nilai uang dalam rupiah bulat, tanpa desimal.
      examples: [72000]
    MetodeBayar:
      type: string
      enum: [tunai, qris, kartu_debit]
    Kesalahan:
      type: object
      description: |
        Kesalahan domain. Nilai `kesalahan` adalah bagian dari kontrak dan
        stabil (boleh dipakai untuk percabangan kode). Nilai `pesan` untuk
        manusia dan dapat berubah kapan saja. Properti tambahan memberi
        konteks sesuai jenis kesalahannya.
      required: [kesalahan, pesan]
      properties:
        kesalahan: { type: string }
        pesan: { type: string }
      additionalProperties: true
    KesalahanValidasi:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    Produk:
      type: object
      required: [sku, nama, kategori, kategori_label, harga, harga_format, stok, tersedia]
      properties:
        sku: { type: string, pattern: '^SKU-[0-9]{3}$' }
        nama: { type: string }
        kategori: { type: string }
        kategori_label: { type: string }
        harga: { $ref: '#/components/schemas/Rupiah' }
        harga_format: { type: string }
        stok: { type: integer, minimum: 0 }
        tersedia: { type: boolean }
    PemasokProduk:
      type: object
      required: [kode, nama, kota, harga_beli, margin, margin_persen, utama]
      properties:
        kode: { type: string }
        nama: { type: string }
        kota: { type: string }
        harga_beli: { $ref: '#/components/schemas/Rupiah' }
        margin: { $ref: '#/components/schemas/Rupiah' }
        margin_persen:
          type: number
          description: Hanya untuk tampilan, dibulatkan satu desimal. Hitungan uang memakai `margin`.
        utama: { type: boolean }
    ProdukDenganPemasok:
      type: object
      required: [sku, nama, harga, pemasok]
      properties:
        sku: { type: string }
        nama: { type: string }
        harga: { $ref: '#/components/schemas/Rupiah' }
        pemasok:
          type: array
          items: { $ref: '#/components/schemas/PemasokProduk' }
    PermintaanTransaksi:
      type: object
      required: [item, metode_bayar]
      properties:
        item:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, kuantitas]
            properties:
              sku: { type: string, pattern: '^SKU-[0-9]{3}$' }
              kuantitas: { type: integer, minimum: 1 }
        member: { type: boolean, default: false }
        metode_bayar: { $ref: '#/components/schemas/MetodeBayar' }
        dibayar:
          $ref: '#/components/schemas/Rupiah'
    ItemStruk:
      type: object
      required: [sku, nama, harga_satuan, kuantitas, diskon, total]
      properties:
        sku: { type: string }
        nama: { type: string }
        harga_satuan: { $ref: '#/components/schemas/Rupiah' }
        kuantitas: { type: integer, minimum: 1 }
        diskon: { $ref: '#/components/schemas/Rupiah' }
        total: { $ref: '#/components/schemas/Rupiah' }
    Struk:
      type: object
      required:
        - nomor
        - waktu
        - kasir
        - member
        - metode_bayar
        - metode_label
        - status
        - item
        - subtotal
        - diskon_grosir
        - diskon_member
        - total_diskon
        - dpp
        - ppn
        - total
        - pembulatan
        - total_bayar
        - dibayar
        - kembalian
        - alasan_batal
        - dibatalkan_oleh
        - dibatalkan_pada
      properties:
        nomor: { type: string, pattern: '^POS-[0-9]{8}-[0-9]{4}$' }
        waktu: { type: string, format: date-time }
        kasir: { type: string }
        member: { type: boolean }
        metode_bayar: { $ref: '#/components/schemas/MetodeBayar' }
        metode_label: { type: string }
        status: { type: string, enum: [selesai, batal] }
        item:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ItemStruk' }
        subtotal: { $ref: '#/components/schemas/Rupiah' }
        diskon_grosir: { $ref: '#/components/schemas/Rupiah' }
        diskon_member: { $ref: '#/components/schemas/Rupiah' }
        total_diskon: { $ref: '#/components/schemas/Rupiah' }
        dpp: { $ref: '#/components/schemas/Rupiah' }
        ppn: { $ref: '#/components/schemas/Rupiah' }
        total: { $ref: '#/components/schemas/Rupiah' }
        pembulatan: { $ref: '#/components/schemas/Rupiah' }
        total_bayar: { $ref: '#/components/schemas/Rupiah' }
        dibayar: { $ref: '#/components/schemas/Rupiah' }
        kembalian: { $ref: '#/components/schemas/Rupiah' }
        alasan_batal: { type: [string, 'null'] }
        dibatalkan_oleh: { type: [string, 'null'] }
        dibatalkan_pada: { type: [string, 'null'], format: date-time }
    LaporanHarian:
      type: object
      required:
        - tanggal
        - jumlah_transaksi
        - omzet
        - omzet_format
        - total_diskon
        - total_ppn
        - rata_rata_struk
        - per_metode_bayar
      properties:
        tanggal: { type: string, format: date }
        jumlah_transaksi: { type: integer, minimum: 0 }
        omzet: { $ref: '#/components/schemas/Rupiah' }
        omzet_format: { type: string }
        total_diskon: { $ref: '#/components/schemas/Rupiah' }
        total_ppn: { $ref: '#/components/schemas/Rupiah' }
        rata_rata_struk: { $ref: '#/components/schemas/Rupiah' }
        per_metode_bayar:
          type: object
          description: Omzet per metode bayar. Kunci berupa nilai `MetodeBayar`.
          additionalProperties: { $ref: '#/components/schemas/Rupiah' }
    ProdukTerlaris:
      type: object
      required: [sku, nama, kuantitas, pendapatan]
      properties:
        sku: { type: string }
        nama: { type: string }
        kuantitas: { type: integer, minimum: 0 }
        pendapatan: { $ref: '#/components/schemas/Rupiah' }
